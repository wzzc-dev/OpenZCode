name: Package Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 打包 job 只需要读源码。创建 GitHub Release 与上传附件需要写权限，
# 只授予 release job，避免任何一次打包运行都能改动远端仓库状态。
permissions:
  contents: read

concurrency:
  group: package-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  package-macos-arm64:
    name: macOS arm64
    needs: verify
    runs-on: macos-14
    timeout-minutes: 60
    env:
      COREPACK_ENABLE_PROJECT_SPEC: "0"
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
      ZCODE_TARGET_OS: mac
      ZCODE_TARGET_ARCH: arm64
      ZCODE_DESKTOP_DIST_DIR: dist-macos-arm64
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      ZCODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-repo

      # 不拆解内部步骤：bundle.mjs 是打包链路的唯一所有者，已内建镜像 fallback、
      # 瞬时网络失败重试，以及缺运行时依赖/越界 native 资源的 fail-closed 校验。
      - name: Package
        run: pnpm bundle:desktop -- --os mac --arch arm64

      - name: List packaged artifacts
        shell: bash
        run: ls -lh "packages/desktop/${ZCODE_DESKTOP_DIST_DIR}"

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            packages/desktop/dist-macos-arm64/*.dmg
            packages/desktop/dist-macos-arm64/*.zip
            packages/desktop/dist-macos-arm64/builder-debug.yml
          if-no-files-found: error
          retention-days: 30

  package-win-x64:
    name: Windows x64
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      COREPACK_ENABLE_PROJECT_SPEC: "0"
      ELECTRON_CACHE: ${{ github.workspace }}\.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.electron-builder-cache
      ZCODE_TARGET_OS: win
      ZCODE_TARGET_ARCH: x64
      ZCODE_DESKTOP_DIST_DIR: dist-win-x64
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      ZCODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-repo

      # 未注入 CSC_LINK / CSC_KEY_PASSWORD，electron-builder 产出未签名 NSIS 安装包，
      # 与 CI 没有 Windows 代码签名证书的现状一致，job 不因未签名失败。
      - name: Package
        run: pnpm bundle:desktop -- --os win --arch x64

      - name: List packaged artifacts
        run: Get-ChildItem -Force packages\desktop\dist-win-x64 | Format-Table Name, Length -AutoSize

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win-x64
          path: |
            packages/desktop/dist-win-x64/*.exe
            packages/desktop/dist-win-x64/builder-debug.yml
          if-no-files-found: error
          retention-days: 30

  package-linux-x64:
    name: Linux x64
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COREPACK_ENABLE_PROJECT_SPEC: "0"
      ELECTRON_CACHE: ${{ github.workspace }}/.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.electron-builder-cache
      ZCODE_TARGET_OS: linux
      ZCODE_TARGET_ARCH: x64
      ZCODE_DESKTOP_DIST_DIR: dist-linux-x64
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      ZCODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup repository
        uses: ./.github/actions/setup-repo

      # fpm 的输出格式依赖主机二进制，而它们不在 ubuntu-24.04 默认镜像里：
      # deb 要 ar(binutils)、rpm 要 rpmbuild(rpm) 与 xz(xz-utils)、
      # pacman 要 bsdtar(libarchive-tools) 与 zstd。缺任何一个都会中断整个 linux job。
      # dpkg-dev / fakeroot 属于防御性安装，实测未成为瓶颈。
      - name: Install Linux packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils rpm xz-utils libarchive-tools zstd dpkg-dev fakeroot

      - name: Package
        run: pnpm bundle:desktop -- --os linux --arch x64

      - name: List packaged artifacts
        shell: bash
        run: ls -lh "packages/desktop/${ZCODE_DESKTOP_DIST_DIR}"

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          path: |
            packages/desktop/dist-linux-x64/*.AppImage
            packages/desktop/dist-linux-x64/*.deb
            packages/desktop/dist-linux-x64/*.rpm
            packages/desktop/dist-linux-x64/*.pkg.tar.zst
            packages/desktop/dist-linux-x64/builder-debug.yml
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs:
      - package-macos-arm64
      - package-win-x64
      - package-linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # gh release 需要仓库上下文；tag 触发时 checkout 已把 tag 指向的 commit 取下来。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts

      # builder-debug.yml 是构建诊断，三个平台同名会互相覆盖，且不是交付物，
      # 因此只按安装包扩展名筛，它留在 workflow artifact 里。
      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for artifact_dir in artifacts/desktop-*; do
            for file in "$artifact_dir"/*; do
              [ -f "$file" ] || continue
              case "${file##*.}" in
                dmg|zip|exe|AppImage|deb|rpm|zst) cp -p "$file" release-assets/ ;;
              esac
            done
          done
          ls -lh release-assets
          count=$(find release-assets -type f | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "没有可发布的安装包，拒绝创建空 Release" >&2
            exit 1
          fi

      # 分支上没有版本 tag，不臆造 tag 也不覆盖已发布的 Release；
      # workflow_dispatch 的产物保留在 workflow artifacts 中。
      - name: Skip release without a version tag
        if: ${{ github.ref_type != 'tag' }}
        run: echo "非 tag 触发：安装包保留在 workflow artifacts 中，未创建 GitHub Release。"

      - name: Publish GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # 同一 tag 重跑要能刷新已发布的 Release；--cleanup-tag=false 只删 Release 对象，保留 git tag。
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag=false
          fi
          # 数组传参：artifactName 里的 ${productName} 会被 electron-builder 净化成
          # ZCode.Preview（appInfo.js 的 sanitizeFileName），但文件名仍可能含分隔符，
          # 直接展开通配符有被 shell 拆词的风险。
          assets=()
          for file in release-assets/*; do
            assets+=("$file")
          done
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes "${assets[@]}"
